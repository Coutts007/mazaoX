services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - mazaox_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      DB_HOST: db          # inside the compose network the database is `db:5432`
      DB_PORT: "5432"
      RUN_MIGRATIONS: "true"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8010}:8000"
    volumes:
      - mazaox_media:/app/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Marks overdue stock reservations as expired once a minute.
  scheduler:
    build: ./backend
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
    command: ["sh", "-c", "while true; do python manage.py expire_reservations; sleep 60; done"]
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mazaox_pgdata:
  mazaox_media:
